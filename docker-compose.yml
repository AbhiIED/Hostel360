version: '3.8'

services:
  # 1. Database Service (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: hostel360_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: hostel360
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-ppassword123']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 2. Backend API & Real-Time Socket.IO Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hostel360_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: mysql://root:password123@mysql:3306/hostel360
      JWT_ACCESS_SECRET: hostel360_production_jwt_access_secret_super_secure_key
      JWT_REFRESH_SECRET: hostel360_production_jwt_refresh_secret_super_secure_key
      QR_TTL_SECONDS: 20
      FRONTEND_URL: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - '5000:5000'

  # 3. Frontend Web App & Static Kiosk Server (Nginx Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hostel360_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
      - '5173:80'

volumes:
  mysql_data:
    driver: local
